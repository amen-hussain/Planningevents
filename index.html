<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fall Hangouts Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e67e22;
    --bg-deep:#c8660f;
    --panel:#faf1e0;
    --panel-2:#f2e6cd;
    --ink:#3a2410;
    --ink-dim:#452a12;
    --panel-ink:#2c1a22;
    --panel-ink-dim:#6d5460;
    --gold:#e0a544;
    --gold-deep:#b97b2c;
    --rose:#c85068;
    --sage:#6f9370;
    --line:rgba(246,236,217,0.16);
    --panel-line:rgba(44,26,34,0.14);
    --radius-lg:20px;
    --radius-md:12px;
    --radius-sm:8px;
    --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-ui:'Space Grotesk', 'Segoe UI', Arial, sans-serif;
    --font-title:'Bricolage Grotesque', 'Segoe UI', Arial, sans-serif;
  }
  :root:not([data-theme="light"]){ color-scheme: dark; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme: dark; } }
  :root[data-theme="dark"]{ color-scheme: dark; }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,255,255,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(255,255,255,0.09), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-ui);
    min-height:100vh;
    line-height:1.5;
  }
  #app{ max-width:920px; margin:0 auto; padding:28px 18px 80px; position:relative; z-index:1; }

  .bg-decor{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .bg-decor span{ position:absolute; font-size:2.6rem; opacity:0.22; line-height:1; filter:saturate(0.9); }

  .hero{ padding:8px 4px 26px; border-bottom:1px solid var(--line); margin-bottom:26px; }
  .hero h1{
    font-family:var(--font-title);
    font-weight:800;
    font-size:clamp(2.1rem, 5vw, 3rem);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .hero p{ margin:0; color:var(--ink-dim); max-width:56ch; font-size:1.02rem; }

  .tabs{
    display:flex; gap:22px; margin-top:22px;
    position:sticky; top:0; z-index:20;
    background:var(--bg); padding:14px 4px 0;
    box-shadow:0 12px 18px -12px rgba(10,20,30,0.35);
  }
  .tab-btn{
    background:none; border:none; cursor:pointer; color:var(--ink-dim);
    font-family:var(--font-ui); font-size:1rem; font-weight:600;
    padding:0 0 10px; border-bottom:2px solid transparent;
  }
  .tab-btn.active{ color:var(--ink); border-bottom-color:var(--gold); text-shadow:none; }

  section.panel{
    background:var(--panel); color:var(--panel-ink);
    border-radius:var(--radius-lg); padding:26px 24px; margin-bottom:20px;
    box-shadow: 0 18px 40px rgba(10,5,15,0.28);
  }
  section.panel h2{
    font-family:var(--font-display); font-size:1.4rem; margin:0 0 4px; font-weight:600;
  }
  section.panel .hint{ color:var(--panel-ink-dim); font-size:0.92rem; margin:0 0 18px; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1.5px solid var(--panel-line); background:transparent; color:var(--panel-ink);
    font-family:var(--font-ui); font-weight:600; font-size:0.92rem;
    padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .chip.selected{ background:var(--panel-ink); color:var(--panel); border-color:var(--panel-ink); }
  .chip.done::after{ content:" ✓"; }
  .add-guest-row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  .guest-input{
    flex:1; min-width:160px; padding:8px 14px; border-radius:999px; border:1.5px solid var(--panel-line);
    background:transparent; color:var(--panel-ink); font-family:var(--font-ui); font-size:0.92rem;
  }
  .guest-input:focus{ outline:2px solid var(--gold-deep); outline-offset:1px; }

  .weekday-grid{
    display:grid; grid-template-columns:64px repeat(7,1fr); gap:6px; align-items:center;
    margin-top:6px; font-size:0.85rem;
  }
  .weekday-grid .rowlabel{ color:var(--panel-ink-dim); font-weight:600; }
  .wd-col-head{ text-align:center; font-weight:600; color:var(--panel-ink-dim); font-size:0.8rem; }
  .pip{
    width:100%; padding:6px 0; border-radius:var(--radius-sm); border:1.5px solid var(--panel-line);
    background:transparent; color:var(--panel-ink); cursor:pointer; font-family:var(--font-ui);
    font-size:0.78rem; font-weight:600;
  }
  .pip.on{ background:var(--sage); border-color:var(--sage); color:#fff; }
  .pip.on.busy{ background:var(--rose); border-color:var(--rose); }

  .months{ display:grid; grid-template-columns:1fr; gap:22px; margin-top:8px; }
  @media(min-width:680px){ .months{ grid-template-columns:1fr 1fr; } }
  .month-block h3{ font-family:var(--font-display); font-size:1.05rem; margin:0 0 10px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-head{ text-align:center; font-size:0.72rem; color:var(--panel-ink-dim); font-weight:600; padding-bottom:2px; }
  .cal-cell{ min-height:56px; }
  .cal-cell.empty{ visibility:hidden; }
  .cal-daynum{ font-size:0.78rem; font-weight:600; text-align:center; margin-bottom:3px; }
  .cal-pips{ display:flex; gap:3px; }
  .cal-pip{
    flex:1; padding:3px 0; font-size:0.62rem; border-radius:5px; border:1.5px solid var(--panel-line);
    background:transparent; color:var(--panel-ink); cursor:pointer; font-family:var(--font-ui); font-weight:700;
  }
  .cal-pip.on{ background:var(--gold-deep); border-color:var(--gold-deep); color:#fff; }
  .cal-pip.on.busy{ background:var(--rose); border-color:var(--rose); }
  .cal-cell.past{ opacity:0.35; }
  .cal-cell.past .cal-daynum{ text-decoration:line-through; }
  .past-pip{ flex:1; text-align:center; font-size:0.62rem; color:var(--panel-ink-dim); cursor:not-allowed; }

  .activity-card{ border:1.5px solid var(--panel-line); border-radius:var(--radius-md); padding:16px; margin-bottom:12px; }
  .activity-card .a-title{ display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:10px; flex-wrap:wrap; }
  .meta-badge{ font-size:0.7rem; font-weight:600; color:var(--panel-ink-dim); background:transparent; border:1px solid var(--panel-line); padding:2px 8px; border-radius:999px; }
  .details-toggle{ margin-top:10px; }
  .details-toggle summary{ cursor:pointer; font-size:0.78rem; color:var(--panel-ink-dim); font-weight:600; list-style:none; }
  .details-toggle summary::-webkit-details-marker{ display:none; }
  .details-toggle summary::before{ content:"Details ▸ "; }
  .details-toggle[open] summary::before{ content:"Details ▾ "; }
  .details-toggle .body{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--panel-line); }
  .weekend-toggle{ display:flex; align-items:center; gap:6px; font-size:0.8rem; color:var(--panel-ink-dim); cursor:pointer; }
  .weekend-toggle input{ cursor:pointer; }
  .minor-btn{ background:none; border:none; color:var(--panel-ink-dim); cursor:pointer; font-size:0.78rem; padding:3px 6px; }
  .minor-btn:hover{ color:var(--panel-ink); }
  .interest-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .interest-btn{
    border:1.5px solid var(--panel-line); background:transparent; color:var(--panel-ink);
    padding:8px 12px; border-radius:999px; cursor:pointer; font-family:var(--font-ui); font-size:0.85rem; font-weight:600;
  }
  .interest-btn.on{ background:var(--rose); border-color:var(--rose); color:#fff; }
  .vote-btn{
    border:1.5px solid var(--panel-line); background:transparent; color:var(--panel-ink);
    padding:9px 16px; border-radius:999px; cursor:pointer; font-family:var(--font-ui); font-size:0.9rem; font-weight:700;
  }
  .vote-btn.on.yes{ background:var(--sage); border-color:var(--sage); color:#fff; }
  .vote-btn.on.no{ background:var(--rose); border-color:var(--rose); color:#fff; }

  .submit-btn{
    display:block; width:100%; margin-top:8px; padding:14px; border:none; border-radius:var(--radius-md);
    background:var(--gold-deep); color:#fff; font-family:var(--font-ui); font-weight:700; font-size:1rem; cursor:pointer;
  }
  .submit-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--panel-ink); color:var(--panel); padding:12px 20px; border-radius:999px;
    font-size:0.9rem; box-shadow:0 10px 26px rgba(0,0,0,0.4); opacity:0; pointer-events:none;
    transition:opacity 0.25s ease; z-index:50; max-width:90vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  .roster{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .roster .who{
    font-size:0.82rem; padding:5px 11px; border-radius:999px; border:1.5px solid var(--panel-line);
    color:var(--panel-ink-dim);
  }
  .roster .who.in{ color:var(--panel-ink); border-color:var(--sage); background:rgba(111,147,112,0.12); }

  .result-block{ margin-bottom:26px; }
  .result-block h3{ font-family:var(--font-display); font-size:1.25rem; margin:0 0 4px; }
  .result-block .subline{ color:var(--panel-ink-dim); font-size:0.88rem; margin:0 0 12px; }
  .slot-card{
    border:1.5px solid var(--panel-line); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:10px;
    display:flex; justify-content:space-between; gap:14px; align-items:flex-start; flex-wrap:wrap;
  }
  .slot-card .slot-when{ font-weight:700; }
  .slot-card .slot-people{ font-size:0.85rem; color:var(--panel-ink-dim); margin-top:4px; }
  .slot-card .slot-score{
    font-family:var(--font-display); font-size:1.3rem; font-weight:700; color:var(--gold-deep); white-space:nowrap;
  }
  .empty-note{ color:var(--panel-ink-dim); font-size:0.9rem; font-style:italic; }

  .act-head{ display:flex; align-items:center; gap:16px; margin-bottom:6px; list-style:none; }
  .act-head::-webkit-details-marker{ display:none; }
  .act-head .chev{ font-size:1.1rem; color:var(--panel-ink-dim); transition:transform 0.15s ease; flex-shrink:0; }
  details[open] > .act-head .chev{ transform:rotate(90deg); }
  .act-head .a-name{ font-family:var(--font-display); font-size:1.25rem; font-weight:600; flex:1; }
  .legend-row{ display:flex; gap:10px; align-items:center; margin:2px 0 14px; flex-wrap:wrap; }
  .legend-dot{ display:inline-flex; align-items:center; gap:4px; font-size:0.72rem; color:var(--panel-ink-dim); }
  .legend-dot span.sw{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .avatar-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .avatar-chip{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:0.72rem; font-weight:700; color:#fff; flex-shrink:0;
  }
  .vote-bar{ display:flex; height:8px; border-radius:6px; overflow:hidden; background:var(--panel-line); margin:8px 0 6px; min-width:120px; }
  .vote-bar .yes{ background:var(--sage); }
  .vote-bar .no{ background:var(--rose); }

  ::selection{ background:var(--gold); color:#20142a; }
</style>
</head>

(function(){
  "use strict";

    var total = counts.reduce(function(a,b){ return a+b; }, 0);
    var r = 30, cx = 40, cy = 40, circumference = 2 * Math.PI * r;
    var svg = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#e9ddc7" stroke-width="12"/>';
    if(total > 0){
      var offset = 0;
      counts.forEach(function(c, i){
        if(!c) return;
        var dash = (c/total) * circumference;
        svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+LEVEL_COLORS[i]+'" stroke-width="12" ' +
          'stroke-dasharray="'+dash.toFixed(2)+' '+(circumference-dash).toFixed(2)+'" ' +
          'stroke-dashoffset="'+(-offset).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
        offset += dash;
      });
    }
    return '<svg width="80" height="80" viewBox="0 0 80 80">' + svg +
      '<text x="40" y="45" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="700" fill="var(--panel-ink)">' + centerText + '</text>' +

  }

  function pad(n){ return n < 10 ? "0"+n : ""+n; }

  function normalizeState(s){

  function isWeekend(dateStr){

  function mutateState(mutatorFn){
    return window.__firestore.runTransaction(window.__firestore.db, function(tx){
      return tx.get(window.__firestore.stateDocRef).then(function(snap){
        var current = normalizeState(snap.exists() ? snap.data() : JSON.parse(JSON.stringify(SEED_STATE)));
        var updated = mutatorFn(current);
        tx.set(window.__firestore.stateDocRef, updated);
      });
    });
  }

  function setActivityCost(actKey, value){
    var cleaned = (value || "").trim().slice(0, 20);
    mutateState(function(s){
      if(!s.activitySettings) s.activitySettings = {};
      if(!s.activitySettings[actKey]) s.activitySettings[actKey] = {};
      s.activitySettings[actKey].cost = cleaned;
      return s;
    }).then(function(){ showToast(cleaned ? "Cost saved." : "Cost cleared."); })
      .catch(function(err){ showToast("Couldn't save — please try again."); console.error(err); });
  }

  function costFor(actKey){
    return (state.activitySettings && state.activitySettings[actKey] && state.activitySettings[actKey].cost) || "";
  }

  function setActivityDetails(actKey, value){
    var cleaned = (value || "").trim().slice(0, 300);
    mutateState(function(s){
      if(!s.activitySettings) s.activitySettings = {};
      if(!s.activitySettings[actKey]) s.activitySettings[actKey] = {};
      s.activitySettings[actKey].details = cleaned;
      return s;
    }).then(function(){ showToast(cleaned ? "Note saved." : "Note cleared."); })
      .catch(function(err){ showToast("Couldn't save — please try again."); console.error(err); });
  }

  function detailsFor(actKey){
    return (state.activitySettings && state.activitySettings[actKey] && state.activitySettings[actKey].details) || "";
  }

  function computeSlotStats(actKey, dateStr, period){
    var people = [], score = 0;
    state.responses.forEach(function(r){
      var lvl = (r.interests && r.interests[actKey]) || 0;
      if(lvl > 0 && r.availability && r.availability[dateStr] && r.availability[dateStr].indexOf(period) > -1){
        people.push({name: r.name, level: lvl});
        score += lvl;
      }
    });
    return {date: dateStr, period: period, score: score, people: people};
  }

  function lockSlot(actKey, date, period){
    mutateState(function(s){
      if(!s.locked) s.locked = {};
      var already = s.locked[actKey] && s.locked[actKey].date === date && s.locked[actKey].period === period;
      if(already){
        delete s.locked[actKey]; // click again to unlock
      } else {
        s.locked[actKey] = {date: date, period: period, lockedBy: ui.selectedName, lockedAt: new Date().toISOString()};
      }
      return s;
    }).then(function(){ showToast("Updated."); })
      .catch(function(err){ showToast("Couldn't save — please try again."); console.error(err); });
  }

  function removeGuest(name){
    if(!window.confirm('Remove "' + name + '" from the guest list? This also deletes their saved answers and votes.')) return;
    mutateState(function(s){
      s.guests = s.guests.filter(function(g){ return g !== name; });
      s.responses = s.responses.filter(function(r){ return r.name !== name; });
      Object.keys(s.votes).forEach(function(slotKey){ delete s.votes[slotKey][name]; });
      return s;
    }).then(function(){
      showToast("Removed " + name + ".");
      if(ui.selectedName === name){ ui.selectedName = null; try{ window.localStorage.removeItem("fh_name"); }catch(e){} }
    }).catch(function(err){ showToast("Couldn't remove — please try again."); console.error(err); });
  }

  function removeCustomActivity(actKey, label){
    if(!window.confirm('Remove "' + label + '" from the list of ideas? This also clears its votes and lock.')) return;
    mutateState(function(s){
      s.customActivities = s.customActivities.filter(function(a){ return a.key !== actKey; });
      if(s.activitySettings) delete s.activitySettings[actKey];
      if(s.locked) delete s.locked[actKey];
      Object.keys(s.votes).forEach(function(slotKey){ if(slotKey.indexOf(actKey + "|") === 0) delete s.votes[slotKey]; });
      return s;
    }).then(function(){ showToast("Removed " + label + "."); })
      .catch(function(err){ showToast("Couldn't remove — please try again."); console.error(err); });
  }

  function votersWaitingOn(slotPeople, slotKey){
    var votes = (state.votes && state.votes[slotKey]) || {};
    return slotPeople.filter(function(p){ return !votes[p.name]; }).map(function(p){ return p.name; });
  }

  function buildICS(activityLabel, dateStr, period){
    var parts = dateStr.split("-").map(Number);
    var startHour = period === "morning" ? 10 : 18;
    var endHour = startHour + 2;
    function stamp(h){ return dateStr.replace(/-/g,"") + "T" + pad(h) + "0000"; }
    var uid = dateStr + "-" + period + "-" + slugify(activityLabel) + "@fall-hangouts";
    var ics = [
      "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Fall Hangouts//EN","BEGIN:VEVENT",
      "UID:" + uid,
      "DTSTAMP:" + stamp(startHour),
      "DTSTART:" + stamp(startHour),
      "DTEND:" + stamp(endHour),
      "SUMMARY:" + activityLabel,
      "DESCRIPTION:Planned via the Fall Hangouts planner",
      "END:VEVENT","END:VCALENDAR"
    ].join("\r\n");
    return "data:text/calendar;charset=utf8," + encodeURIComponent(ics);
  }

  function startNewSeason(){
    if(ui.selectedName !== "Amen"){ showToast("Only Amen can start a new season."); return; }
    if(!window.confirm("Archive everything and start fresh? Current answers, votes, and locked plans will be saved to an archive but cleared from the live view. This can't be easily undone.")) return;
    mutateState(function(s){
      var snapshot = {
        archivedAt: new Date().toISOString(),
        responses: s.responses, guests: s.guests, votes: s.votes,
        customActivities: s.customActivities, activitySettings: s.activitySettings, locked: s.locked
      };
      s.archive = (s.archive || []).concat([snapshot]).slice(-3);
      s.responses = []; s.guests = []; s.votes = {}; s.customActivities = [];
      s.activitySettings = {}; s.locked = {};
      return s;
    }).then(function(){
      showToast("Archived! Starting fresh.");
      try{ window.localStorage.removeItem("fh_name"); }catch(e){}
      ui.selectedName = null; ui.tab = "form";
    }).catch(function(err){ showToast("Couldn't reset — please try again."); console.error(err); });
  }

  var ui = {
    tab: "form",
    selectedName: null,
    addingGuest: false,
    addingEvent: false,
    email: "",
    mode: "free", // "free" = mark when you're free, "busy" = mark when you're busy
    openActivities: {}, // tracks which result dropdowns are expanded, keyed by activity key
    resultsFilter: "all", // "all" or "mine" — filters the results tab to just your own interests
    dayFilter: "all", // "all" or "weekend" — filters which suggested slots are shown
    slotsShown: {}, // how many suggested dates to show per activity key (default 3)
    notes: "",
    availability: {},   // dateKey -> {morning:bool, evening:bool}
    interests: {}
  };

  function findResponse(name){
    for(var i=0;i<state.responses.length;i++){ if(state.responses[i].name === name) return state.responses[i]; }
    return null;
  }

  function hasCompletedForm(){
    return !!(ui.selectedName && findResponse(ui.selectedName));
  }

  // Restore the last person who used this browser so returning visitors
  // land back on their own answers instead of starting over. Runs once,
  // right after the first live snapshot arrives.
  function restoreFromStorage(){
    var savedName = null;
    try{ savedName = window.localStorage.getItem("fh_name"); }catch(e){}
    if(savedName && allNames().indexOf(savedName) > -1){
      loadNameIntoForm(savedName);
      if(hasCompletedForm()) ui.tab = "results";
    }
  }

  function allDateKeys(){
    var out = [];
    MONTHS.forEach(function(mo){
      var dim = daysInMonth(mo.y, mo.m);
      for(var d=1; d<=dim; d++){
        var k = dateKey(mo.y, mo.m, d);
        if(!isPastDate(k)) out.push(k);
      }
    });
    return out;
  }

  function loadNameIntoForm(name){
    ui.selectedName = name;
    var existing = findResponse(name);
    ui.availability = {};
    ui.email = "";
    ui.notes = "";
    ui.mode = "free";
    ui.interests = {};
    allActivities().forEach(function(act){ ui.interests[act.key] = 0; });
    if(existing){
      if(existing.email) ui.email = existing.email;
      if(existing.notes) ui.notes = existing.notes;
      ui.mode = existing.inputMode === "busy" ? "busy" : "free";
      if(existing.availability){
        if(ui.mode === "free"){
          Object.keys(existing.availability).forEach(function(k){
            var periods = existing.availability[k];
            ui.availability[k] = { morning: periods.indexOf("morning")>-1, evening: periods.indexOf("evening")>-1 };
          });
        } else {
          // Reconstruct which slots they marked busy: anything NOT free.
          allDateKeys().forEach(function(k){
            var freePeriods = existing.availability[k] || [];
            ui.availability[k] = {
              morning: freePeriods.indexOf("morning") === -1,
              evening: freePeriods.indexOf("evening") === -1
            };
          });
        }
      }
      if(existing.interests){
        Object.keys(ui.interests).forEach(function(k){
          if(typeof existing.interests[k] === "number") ui.interests[k] = existing.interests[k];
        });
      }
    }
  }

  function setMode(mode){
    if(ui.mode === mode) return;
    ui.mode = mode;
    ui.availability = {};
    render();
    showToast(mode === "busy" ? "Now mark the times you're busy — everything else counts as free." : "Now mark the times you're free.");
  }

  function clearFormInputs(){
    ui.availability = {};
    ui.email = "";
    ui.notes = "";
    ui.mode = "free";
    ui.interests = {};
    allActivities().forEach(function(act){ ui.interests[act.key] = 0; });
  }

  function togglePeriod(key, period){
    if(!ui.availability[key]) ui.availability[key] = {morning:false, evening:false};
    ui.availability[key][period] = !ui.availability[key][period];
    render();
  }

  function weekdayAllOn(wdIndex, period){
    var any = false, dates = weekdayDates(wdIndex);
    if(dates.length === 0) return false;
    for(var i=0;i<dates.length;i++){
      var a = ui.availability[dates[i]];
      if(!a || !a[period]) return false;
      any = true;
    }
    return any;
  }

  function weekdayDates(wdIndex){
    var out = [];
    MONTHS.forEach(function(mo){
      var dim = daysInMonth(mo.y, mo.m);
      for(var d=1; d<=dim; d++){
        var jsDay = new Date(Date.UTC(mo.y, mo.m, d)).getUTCDay();
        var k = dateKey(mo.y, mo.m, d);
        if(mondayIndex(jsDay) === wdIndex && !isPastDate(k)) out.push(k);
      }
    });
    return out;
  }

  function toggleWeekday(wdIndex, period){
    var turnOn = !weekdayAllOn(wdIndex, period);
    weekdayDates(wdIndex).forEach(function(key){
      if(!ui.availability[key]) ui.availability[key] = {morning:false, evening:false};
      ui.availability[key][period] = turnOn;
    });
    render();
  }

  function setInterest(actKey, v){
    ui.interests[actKey] = v;
    render();
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    if(!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 3600);
  }

  function addGuest(rawName){
    var name = (rawName || "").trim();
    if(!name){ showToast("Type a name first."); return; }
    if(name.length > 30) name = name.slice(0,30);
    var existing = allNames().filter(function(n){ return n.toLowerCase() === name.toLowerCase(); })[0];
    if(existing){
      ui.addingGuest = false;
      loadNameIntoForm(existing);
      render();
      return;
    }
    ui.addingGuest = false;
    loadNameIntoForm(name);
    try{ window.localStorage.setItem("fh_name", name); }catch(e){}
    render();

    showToast("Adding you to the guest list...");
    mutateState(function(s){
      var dup = s.guests.some(function(g){ return g.toLowerCase() === name.toLowerCase(); });
      if(!dup) s.guests.push(name);
      return s;
    }).then(function(){
      showToast("You're on the list! Now add your availability below.");
    }).catch(function(err){
      showToast("Couldn't save the guest list — please try again.");
      console.error(err);
    });
  }

  function slugify(name){
    var base = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
    if(!base) base = "event";
    var key = base, n = 2;
    var existingKeys = allActivities().map(function(a){ return a.key; });
    while(existingKeys.indexOf(key) > -1){ key = base + "-" + n; n++; }
    return key;
  }

  function addEvent(rawName){
    var name = (rawName || "").trim();
    if(!name){ showToast("Type an event name first."); return; }
    if(name.length > 40) name = name.slice(0,40);
    var dup = allActivities().filter(function(a){ return a.label.toLowerCase() === name.toLowerCase(); })[0];
    if(dup){ showToast(name + " is already on the list."); ui.addingEvent = false; render(); return; }

    var newAct = {key: slugify(name), label: name, emoji: "🎉"};

    var dateInput = document.getElementById("event-date-input");
    var periodInput = document.getElementById("event-period-input");
    if(dateInput && dateInput.value && !isPastDate(dateInput.value)){
      newAct.proposedDate = dateInput.value;
      newAct.proposedPeriod = (periodInput && periodInput.value === "evening") ? "evening" : "morning";
      newAct.proposedBy = ui.selectedName;
    }

    if(ui.selectedName) ui.interests[newAct.key] = 0;
    ui.addingEvent = false;

    // Open a pre-filled email to everyone who's shared their address —
    // fires while we still have the click's user-gesture context.
    var emails = allKnownEmails();
    var hadEmails = emails.length > 0;
    if(hadEmails){
      var subject = encodeURIComponent("New Fall Hangouts idea: " + name);
      var whenNote = newAct.proposedDate ? (" — proposed for " + formatDateKey(newAct.proposedDate) + " (" + newAct.proposedPeriod + ")") : "";
      var body = encodeURIComponent("Just added \"" + name + "\"" + whenNote + " to the Fall Hangouts planner. Hop back in and rate how into it you are, and share your availability: " + window.location.href);
      var mailto = "mailto:?bcc=" + emails.join(",") + "&subject=" + subject + "&body=" + body;
      window.location.href = mailto;
    }

    render();
    showToast("Adding the new event...");
    mutateState(function(s){
      var already = s.customActivities.some(function(a){ return a.label.toLowerCase() === name.toLowerCase(); });
      if(!already) s.customActivities.push(newAct);
      return s;
    }).then(function(){
      showToast(hadEmails ? ("Added! Everyone can now rate " + name + ".") : ("Added " + name + "! No one's left an email yet, so share the link so people see it."));
    }).catch(function(err){
      showToast("Couldn't save the new event — please try again.");
      console.error(err);
    });
  }

  // If someone updates their availability or interest and it no longer
  // matches a slot they voted on (e.g. "something came up"), drop their
  // stale vote for that slot so tallies stay honest.
  function cleanupStaleVotesOnState(s, response){
    Object.keys(s.votes).forEach(function(slotKey){
      var mine = s.votes[slotKey][response.name];
      if(mine === undefined) return;
      var parts = slotKey.split("|");
      var actKey = parts[0], date = parts[1], period = parts[2];
      var stillInterested = response.interests && response.interests[actKey] > 0;
      var stillFree = response.availability && response.availability[date] && response.availability[date].indexOf(period) > -1;
      if(!stillInterested || !stillFree){
        delete s.votes[slotKey][response.name];
      }
    });
  }

  function submitResponse(){
    if(!ui.selectedName){ showToast("Pick your name first."); return; }
    var availOut = {};
    if(ui.mode === "busy"){
      allDateKeys().forEach(function(k){
        var a = ui.availability[k] || {morning:false, evening:false};
        var periods = [];
        if(!a.morning) periods.push("morning");
        if(!a.evening) periods.push("evening");
        if(periods.length) availOut[k] = periods;
      });
    } else {
      Object.keys(ui.availability).forEach(function(k){
        var a = ui.availability[k];
        var periods = [];
        if(a.morning) periods.push("morning");
        if(a.evening) periods.push("evening");
        if(periods.length) availOut[k] = periods;
      });
    }
    var emailInput = document.getElementById("email-input");
    var emailVal = (emailInput ? emailInput.value : ui.email || "").trim();
    var notesInput = document.getElementById("notes-input");
    var notesVal = (notesInput ? notesInput.value : ui.notes || "").trim().slice(0, 300);
    var response = {
      name: ui.selectedName,
      email: emailVal,
      notes: notesVal,
      inputMode: ui.mode,
      availability: availOut,
      interests: ui.interests,
      submittedAt: new Date().toISOString()
    };
    try{ window.localStorage.setItem("fh_name", response.name); }catch(e){}

    showToast("Saving...");
    mutateState(function(s){
      var idx = -1;
      for(var i=0;i<s.responses.length;i++){ if(s.responses[i].name === response.name) idx = i; }
      if(idx>-1) s.responses[idx] = response; else s.responses.push(response);
      cleanupStaleVotesOnState(s, response);
      return s;
    }).then(function(){
      showToast("Saved! Everyone sees it instantly.");
    }).catch(function(err){
      showToast("Couldn't save — please try again.");
      console.error(err);
    });
  }

  function voteSlot(actKey, date, period, choice){
    if(!ui.selectedName){ showToast("Pick your name first."); return; }
    var slotKey = actKey + "|" + date + "|" + period;
    mutateState(function(s){
      if(!s.votes[slotKey]) s.votes[slotKey] = {};
      if(s.votes[slotKey][ui.selectedName] === choice){
        delete s.votes[slotKey][ui.selectedName]; // click again to retract
      } else {
        s.votes[slotKey][ui.selectedName] = choice;
      }
      return s;
    }).then(function(){
      showToast("Vote saved.");
    }).catch(function(err){
      showToast("Couldn't save your vote — please try again.");
      console.error(err);
    });
  }

  function tallyVotes(slotKey){
    var votes = state.votes[slotKey] || {};
    var yes = 0, no = 0;
    Object.keys(votes).forEach(function(n){ if(votes[n]==="yes") yes++; else if(votes[n]==="no") no++; });
    return {yes:yes, no:no, mine: votes[ui.selectedName] || null};
  }

  // ---- Suggestion engine ----
  function suggestSlots(actKey){
    var interested = state.responses.filter(function(r){ return r.interests && r.interests[actKey] > 0; });
    if(interested.length === 0) return {interested: [], slots: []};
    var slotMap = {};
    interested.forEach(function(r){
      if(!r.availability) return;
      Object.keys(r.availability).forEach(function(dateK){
        if(isPastDate(dateK)) return; // never suggest a date that's already gone
        if(isWeekendOnly(actKey) && !isWeekend(dateK)) return; // this activity is flagged weekends-only
        r.availability[dateK].forEach(function(period){
          var slotKey = dateK + "|" + period;
          if(!slotMap[slotKey]) slotMap[slotKey] = {date:dateK, period:period, score:0, people:[]};
          slotMap[slotKey].score += r.interests[actKey];
          slotMap[slotKey].people.push({name:r.name, level:r.interests[actKey]});
        });
      });
    });
    var slots = Object.keys(slotMap).map(function(k){ return slotMap[k]; });
    slots.sort(function(a,b){
      if(b.score !== a.score) return b.score - a.score;
      if(b.people.length !== a.people.length) return b.people.length - a.people.length;
      return a.date.localeCompare(b.date);
    });
    return {interested: interested, slots: slots};
  }

  // ---- Rendering ----
  function render(){
    var app = document.getElementById("app");
    var body = ui.tab === "form" ? formHtml() : (ui.tab === "confirmed" ? confirmedHtml() : resultsHtml());
    app.innerHTML =
      heroHtml() +
      tabsHtml() +
      body +
      '<div class="toast" id="toast"></div>';
    bindEvents();
  }

  function heroHtml(){
    return '<div class="hero">' +
      '<h1>Fall Hangouts</h1>' +
      '<p>Share when you\'re free across September and October 2026, and how excited you are about each idea. We\'ll line it all up and find the best dates for the group.</p>' +
      '</div>';
  }

  function tabsHtml(){
    return '<div class="tabs">' +
      '<button class="tab-btn' + (ui.tab==="form"?" active":"") + '" data-action="tab" data-tab="form">Add your availability</button>' +
      '<button class="tab-btn' + (ui.tab==="results"?" active":"") + '" data-action="tab" data-tab="results">See the plan</button>' +
      '<button class="tab-btn' + (ui.tab==="confirmed"?" active":"") + '" data-action="tab" data-tab="confirmed">🎉 Confirmed</button>' +
      '</div>';
  }

  function confirmedHtml(){
    var lockedKeys = Object.keys(state.locked || {});
    var html = '';
    if(lockedKeys.length === 0){
      html += '<section class="panel"><h2>Nothing locked in yet</h2><p class="hint">Once a date gets locked in from "See the plan," it\'ll show up here as the official plan.</p></section>';
    } else {
      lockedKeys.forEach(function(actKey){
        var act = allActivities().filter(function(a){ return a.key === actKey; })[0];
        if(!act) return;
        var lock = state.locked[actKey];
        var whenLabel = formatDateKey(lock.date) + ' · ' + (lock.period==="morning"?"Morning":"Evening");
        var people = state.responses.filter(function(r){
          return r.interests && r.interests[actKey] > 0 &&
            r.availability && r.availability[lock.date] && r.availability[lock.date].indexOf(lock.period) > -1;
        });
        var avatarsHtml = people.map(function(p){
          var lvl = p.interests[actKey];
          return '<div class="avatar-chip" style="background:' + LEVEL_COLORS[lvl] + '" title="' + escapeAttr(p.name) + '">' + initials(p.name) + '</div>';
        }).join("");
        html += '<section class="panel result-block">';
        html += '<div class="a-name" style="margin-bottom:4px;">' + act.emoji + ' ' + act.label + (costFor(actKey) ? ' <span class="meta-badge">💵 ' + escapeAttr(costFor(actKey)) + '</span>' : '') + '</div>';
        html += '<div class="slot-when" style="font-size:1.1rem;">' + whenLabel + '</div>';
        html += '<div class="avatar-row">' + avatarsHtml + '</div>';
        html += '<div style="display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap;">';
        html += '<a href="' + buildICS(act.label, lock.date, lock.period) + '" download="' + slugify(act.label) + '.ics" class="chip" style="text-decoration:none;">📅 Add to calendar</a>';
        html += '<button class="chip" data-action="lock-slot" data-act="' + actKey + '" data-date="' + lock.date + '" data-period="' + lock.period + '">🔓 Unlock</button>';
        html += '</div></section>';
      });
    }
    if(ui.selectedName === "Amen"){
      html += '<section class="panel" style="text-align:center;">' +
        '<p class="hint">Done with fall? Archive everything here and reuse this same page for the next season.</p>' +
        '<button class="chip" data-action="new-season">Start a new season</button>' +
        '</section>';
    }
    return html;
  }

  function formHtml(){
    var respondedNames = state.responses.map(function(r){ return r.name; });
    var html = '<section class="panel">';

    html += '<h2>Who are you?</h2><p class="hint">Pick your name — if you\'ve already answered, we\'ll load what you saved so you can update it.</p>';
    html += '<div class="chip-row">';
    allNames().forEach(function(name){
      var sel = ui.selectedName === name;
      var done = respondedNames.indexOf(name) > -1;
      var isGuest = FRIENDS.indexOf(name) === -1;
      if(isGuest){
        html += '<span style="display:inline-flex; align-items:center; gap:2px;">' +

  function monthCalendarHtml(mo){
    var dim = daysInMonth(mo.y, mo.m);
    var firstJsDay = new Date(Date.UTC(mo.y, mo.m, 1)).getUTCDay();
    var leading = mondayIndex(firstJsDay);
    var html = '<div class="month-block"><h3>' + mo.label + '</h3><div class="cal-grid">';
    WEEKDAYS.forEach(function(wd){ html += '<div class="cal-head">' + wd[0] + '</div>'; });
    for(var i=0;i<leading;i++){ html += '<div class="cal-cell empty"></div>'; }
    for(var d=1; d<=dim; d++){
      var key = dateKey(mo.y, mo.m, d);
      if(isPastDate(key)){
        html += '<div class="cal-cell past"><div class="cal-daynum">' + d + '</div>' +
          '<div class="cal-pips"><span class="cal-pip past-pip">—</span><span class="cal-pip past-pip">—</span></div></div>';
        continue;
      }
      var a = ui.availability[key] || {morning:false, evening:false};
      var busyMode = ui.mode === "busy";
      html += '<div class="cal-cell">' +
        '<div class="cal-daynum">' + d + '</div>' +
        '<div class="cal-pips">' +
        '<button class="cal-pip' + (a.morning?' on'+(busyMode?' busy':''):'') + '" data-action="day-toggle" data-key="' + key + '" data-period="morning">AM</button>' +
        '<button class="cal-pip' + (a.evening?' on'+(busyMode?' busy':''):'') + '" data-action="day-toggle" data-key="' + key + '" data-period="evening">PM</button>' +
        '</div></div>';
    }
    html += '</div></div>';
    return html;
  }

  function everyoneAnswersHtml(){
    if(state.responses.length === 0) return "";
    var html = '<section class="panel result-block"><h3>Everyone\'s answers</h3>';
    html += '<p class="subline">Dot color = interest level. Tap a name to see their exact free dates.</p>';
    state.responses.slice().sort(function(a,b){ return a.name.localeCompare(b.name); }).forEach(function(r){
      var interestBits = allActivities().map(function(act){
        var v = (r.interests && r.interests[act.key]) || 0;
        return '<span title="' + escapeAttr(act.label) + ': ' + v + '/3" style="display:inline-flex; align-items:center; gap:3px; margin-right:10px;">' + act.emoji +
          '<span style="width:9px; height:9px; border-radius:50%; background:' + LEVEL_COLORS[v] + '; display:inline-block;"></span></span>';
      }).join("");
      if(r.email) interestBits += '📧';

      var dateEntries = [];
      if(r.availability){
        Object.keys(r.availability).sort().forEach(function(k){
          if(isPastDate(k)) return;
          r.availability[k].forEach(function(period){
            dateEntries.push(formatDateKey(k) + " " + (period === "morning" ? "AM" : "PM"));
          });
        });
      }
      var dateList = dateEntries.length ? dateEntries.join(", ") : "No free times marked yet.";

      html += '<details style="margin-bottom:10px;">' +
        '<summary style="cursor:pointer; font-weight:700;">' + r.name + '<span style="font-weight:500; color:var(--panel-ink-dim); margin-left:10px; font-size:0.85rem;">' + interestBits + '</span></summary>' +
        '<p style="font-size:0.85rem; color:var(--panel-ink-dim); margin:8px 0 0;">' + dateList + '</p>' +
        (r.notes ? '<p style="font-size:0.85rem; color:var(--panel-ink); margin:6px 0 0; font-style:italic;">"' + escapeAttr(r.notes) + '"</p>' : '') +
        '</details>';
    });
    html += '</section>';
    return html;
  }

  function resultsHtml(){
    var respondedNames = state.responses.map(function(r){ return r.name; });
    var html = '<section class="panel"><h2>Who\'s in so far</h2>';
    html += '<div class="roster">';
    allNames().forEach(function(name){
      var in_ = respondedNames.indexOf(name) > -1;
      html += '<span class="who' + (in_?' in':'') + '">' + name + (in_?' ✓':' — waiting') + '</span>';
    });
    html += '</div></section>';

    if(!hasCompletedForm()){
      html += '<section class="panel">';
      html += '<h2>Fill in your own answers to unlock this</h2>';
      html += '<p class="hint">Once you\'ve saved your availability and interest levels, you\'ll be able to see everyone else\'s answers and the suggested dates here.</p>';
      html += '<button class="submit-btn" data-action="tab" data-tab="form">Go add your availability</button>';
      html += '</section>';
      return html;
    }

    html += everyoneAnswersHtml();

    html += '<section class="panel" style="padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">' +
      '<p class="hint" style="margin:0;">Plans change — you can go back and update your availability or interest levels any time, and it\'ll update everywhere below.</p>' +
      '<button class="chip" data-action="tab" data-tab="form">Edit my answers</button>' +
      '</section>';

    html += '<section class="panel" style="padding:14px 24px; background:var(--gold); border:1px solid var(--gold-deep);">' +
      '<p class="hint" style="margin:0; color:var(--panel-ink); font-weight:600;">👇 See a date you like? Tap ✅ or ❌ under it to vote — that\'s how we know what to lock in.</p>' +
      '</section>';

    html += '<section class="panel" style="padding:14px 24px;">' +
      '<div class="chip-row" style="margin-bottom:8px;">' +
      '<button class="chip' + (ui.resultsFilter==="all"?' selected':'') + '" data-action="set-results-filter" data-filter="all">All events</button>' +
      '<button class="chip' + (ui.resultsFilter==="mine"?' selected':'') + '" data-action="set-results-filter" data-filter="mine">Just what I\'m into</button>' +
      '</div>' +
      '<div class="chip-row">' +
      '<button class="chip' + (ui.dayFilter==="all"?' selected':'') + '" data-action="set-day-filter" data-filter="all">Any day</button>' +
      '<button class="chip' + (ui.dayFilter==="weekend"?' selected':'') + '" data-action="set-day-filter" data-filter="weekend">Weekends only</button>' +
      '</div></section>';

    var myResponse = findResponse(ui.selectedName);
    var shownAny = false;
    allActivities().forEach(function(act){
      if(ui.resultsFilter === "mine"){
        var myLevel = (myResponse && myResponse.interests && myResponse.interests[act.key]) || 0;
        if(myLevel === 0) return;
      }
      shownAny = true;
      var res = suggestSlots(act.key);
      html += '<section class="panel result-block">';

      var counts = [0,0,0,0];
      state.responses.forEach(function(r){
        var lvl = (r.interests && r.interests[act.key]) || 0;
        counts[lvl]++;
      });
      var totalIn = counts[1] + counts[2] + counts[3];
      var totalResp = state.responses.length;
      var lockInfo = state.locked && state.locked[act.key];

      html += '<details data-act-details="' + act.key + '"' + (ui.openActivities[act.key] ? ' open' : '') + '><summary class="act-head" style="cursor:pointer;">' +
        '<span class="chev">▸</span>' +
        donutSVG(counts, totalIn + "/" + totalResp) +
        '<div class="a-name">' + act.emoji + ' ' + act.label +
        (isWeekendOnly(act.key) ? ' <span class="meta-badge">🗓️ Weekends only</span>' : '') +
        (lockInfo ? ' <span class="meta-badge">🔒 ' + formatDateKey(lockInfo.date) + '</span>' : '') +
        '</div>' +
        '</summary>';
      html += '<div style="margin-top:12px;">';
      if(detailsFor(act.key)){
        html += '<p class="hint" style="font-style:italic; margin-bottom:10px;">📝 ' + escapeAttr(detailsFor(act.key)) + '</p>';
      }
      html += '<div class="legend-row">' +
        '<span class="legend-dot"><span class="sw" style="background:' + LEVEL_COLORS[3] + '"></span>Need this</span>' +
        '<span class="legend-dot"><span class="sw" style="background:' + LEVEL_COLORS[2] + '"></span>Would go</span>' +
        '<span class="legend-dot"><span class="sw" style="background:' + LEVEL_COLORS[1] + '"></span>Curious</span>' +
        '<span class="legend-dot"><span class="sw" style="background:' + LEVEL_COLORS[0] + '"></span>Not for me</span>' +
        '</div>';

      if(totalIn === 0){
        html += '<p class="empty-note">No one has marked interest yet.</p></div></details></section>';
        return;
      }
      var allMatching = res.slots.slice();
      if(act.proposedDate && !isPastDate(act.proposedDate)){
        var alreadyIn = allMatching.filter(function(s){ return s.date === act.proposedDate && s.period === act.proposedPeriod; })[0];
        if(alreadyIn){
          alreadyIn.proposed = true; alreadyIn.proposedBy = act.proposedBy;
        } else {
          var proposedSlot = computeSlotStats(act.key, act.proposedDate, act.proposedPeriod);
          proposedSlot.proposed = true; proposedSlot.proposedBy = act.proposedBy;
          allMatching.unshift(proposedSlot);
        }
      }
      if(ui.dayFilter === "weekend") allMatching = allMatching.filter(function(s){ return isWeekend(s.date); });
      var shownCount = ui.slotsShown[act.key] || 3;
      var displaySlots = allMatching.slice(0, shownCount);

      var lock = state.locked && state.locked[act.key];

      if(displaySlots.length === 0){
        html += '<p class="empty-note">' + (ui.dayFilter === "weekend" ? "No shared weekend availability yet among interested people." : "No shared free time yet among interested people — check back once more availability is in.") + '</p>';
      } else {
        displaySlots.forEach(function(slot){
          var slotKey = act.key + "|" + slot.date + "|" + slot.period;
          var tally = tallyVotes(slotKey);
          var whenLabel = formatDateKey(slot.date) + ' · ' + (slot.period==="morning"?"Morning":"Evening");
          var isLocked = lock && lock.date === slot.date && lock.period === slot.period;

          var sortedPeople = slot.people.slice().sort(function(a,b){ return b.level-a.level; });
          var avatarsHtml = sortedPeople.map(function(p){
            return '<div class="avatar-chip" style="background:' + LEVEL_COLORS[p.level] + '" title="' + escapeAttr(p.name) + ' — ' + p.level + '/3">' + initials(p.name) + '</div>';
          }).join("");

          var waiting = votersWaitingOn(slot.people, slotKey);
          var waitingHtml = waiting.length ? '<div style="font-size:0.75rem; color:var(--panel-ink-dim); margin-top:4px;">Waiting on: ' + waiting.map(escapeAttr).join(", ") + '</div>' : '';

          var emails = slot.people.map(function(p){ return emailFor(p.name); }).filter(Boolean);
          var mailtoLink = "";
          if(emails.length){
            var subject = encodeURIComponent("Fall Hangouts: " + act.label + " — " + whenLabel);
            var body = encodeURIComponent("Hey! Locking in " + act.label + " for " + whenLabel + ". Let me know if that still works!");
            var mailtoHref = "mailto:?bcc=" + emails.join(",") + "&subject=" + subject + "&body=" + body;
            mailtoLink = '<button class="minor-btn" data-action="notify-slot" data-mailto="' + escapeAttr(mailtoHref) + '" data-count="' + emails.length + '" style="font-size:0.78rem; color:var(--gold-deep); font-weight:600; white-space:nowrap;">📧 Notify</button>';
          }

          var voteTotal = tally.yes + tally.no;
          var yesPct = voteTotal ? (tally.yes/voteTotal*100) : 0;
          var noPct = voteTotal ? (tally.no/voteTotal*100) : 0;

          html += '<div class="slot-card"' + (isLocked ? ' style="border-color:var(--sage); border-width:2px;"' : '') + '>' +
            '<div style="flex:1; min-width:200px;">' +
            '<div class="slot-when">' + whenLabel + (isLocked ? ' <span class="meta-badge">🔒 Locked in</span>' : '') + (slot.proposed ? ' <span class="meta-badge">💡 Proposed by ' + escapeAttr(slot.proposedBy || "someone") + '</span>' : '') + '</div>' +
            '<div class="avatar-row">' + avatarsHtml + '</div>' +
            waitingHtml +
            '<div class="vote-bar"><div class="yes" style="width:' + yesPct + '%"></div><div class="no" style="width:' + noPct + '%"></div></div>' +
            '<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px;">' +
            '<button class="vote-btn' + (tally.mine==="yes"?' on yes':'') + '" data-action="vote" data-act="' + act.key + '" data-date="' + slot.date + '" data-period="' + slot.period + '" data-choice="yes">✅ ' + tally.yes + '</button>' +
            '<button class="vote-btn' + (tally.mine==="no"?' on no':'') + '" data-action="vote" data-act="' + act.key + '" data-date="' + slot.date + '" data-period="' + slot.period + '" data-choice="no">❌ ' + tally.no + '</button>' +
            '</div>' +
            '<div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:8px;">' +
            '<button class="minor-btn" data-action="lock-slot" data-act="' + act.key + '" data-date="' + slot.date + '" data-period="' + slot.period + '">' + (isLocked ? '🔓 Unlock' : '🔒 Lock this in') + '</button>' +
            (mailtoLink || "") +
            '</div></div>' +
            '<div class="slot-score">' + slot.score + '</div></div>';
        });
        if(allMatching.length > shownCount){
          html += '<button class="chip" data-action="show-more-slots" data-act="' + act.key + '" style="width:100%; text-align:center; margin-top:6px;">Show ' + Math.min(3, allMatching.length - shownCount) + ' more date' + ((allMatching.length - shownCount) > 1 ? 's' : '') + '</button>';
        } else if(shownCount > 3){
          html += '<button class="minor-btn" data-action="show-fewer-slots" data-act="' + act.key + '" style="width:100%; text-align:center; margin-top:6px;">Show fewer</button>';
        }
      }
      html += '</div></details></section>';
    });

    if(!shownAny){
      html += '<section class="panel"><p class="empty-note">You haven\'t marked interest in anything yet — go back and rate a few ideas to see them here.</p></section>';
    }

    return html;
  }

  function bindEvents(){
    var app = document.getElementById("app");
    app.onclick = function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      var action = el.dataset.action;
      if(action === "tab"){ ui.tab = el.dataset.tab; render(); }
      else if(action === "set-results-filter"){ ui.resultsFilter = el.dataset.filter; render(); }
      else if(action === "pick-name"){ loadNameIntoForm(el.dataset.name); render(); }
      else if(action === "wd-toggle"){ toggleWeekday(parseInt(el.dataset.wd,10), el.dataset.period); }
      else if(action === "set-mode"){ setMode(el.dataset.mode); }
      else if(action === "day-toggle"){ togglePeriod(el.dataset.key, el.dataset.period); }
      else if(action === "interest"){ setInterest(el.dataset.act, parseInt(el.dataset.val,10)); }
      else if(action === "toggle-weekend"){ toggleWeekendOnly(el.dataset.act); }
      else if(action === "save-cost"){
        var costInp = document.getElementById("cost-input-" + el.dataset.act);
        setActivityCost(el.dataset.act, costInp ? costInp.value : "");
      }
      else if(action === "save-details"){
        var detailsInp = document.getElementById("details-input-" + el.dataset.act);
        setActivityDetails(el.dataset.act, detailsInp ? detailsInp.value : "");
      }
      else if(action === "remove-event"){ removeCustomActivity(el.dataset.act, el.dataset.label); }
      else if(action === "remove-guest"){ removeGuest(el.dataset.name); }
      else if(action === "lock-slot"){ lockSlot(el.dataset.act, el.dataset.date, el.dataset.period); }
      else if(action === "notify-slot"){
        var n = parseInt(el.dataset.count, 10) || 0;
        showToast("Opening an email draft to " + n + " " + (n===1?"person":"people") + " — nothing sends until you hit send in your mail app.");
        window.location.href = el.dataset.mailto;
      }
      else if(action === "set-day-filter"){ ui.dayFilter = el.dataset.filter; render(); }
      else if(action === "show-more-slots"){ ui.slotsShown[el.dataset.act] = (ui.slotsShown[el.dataset.act] || 3) + 3; render(); }
      else if(action === "show-fewer-slots"){ ui.slotsShown[el.dataset.act] = 3; render(); }
      else if(action === "new-season"){ startNewSeason(); }
      else if(action === "vote"){ voteSlot(el.dataset.act, el.dataset.date, el.dataset.period, el.dataset.choice); }
      else if(action === "submit"){ submitResponse(); }
      else if(action === "clear-form"){
        clearFormInputs();
        render();
        showToast("Cleared — nothing's saved until you hit \"Save my availability\" again.");
      }
      else if(action === "show-add-guest"){ ui.addingGuest = true; render();
        var inp = document.getElementById("guest-name-input"); if(inp) inp.focus(); }
      else if(action === "cancel-add-guest"){ ui.addingGuest = false; render(); }
      else if(action === "confirm-add-guest"){
        var inp2 = document.getElementById("guest-name-input");
        addGuest(inp2 ? inp2.value : "");
      }
      else if(action === "show-add-event"){ ui.addingEvent = true; render();
        var inp3 = document.getElementById("event-name-input"); if(inp3) inp3.focus(); }
      else if(action === "cancel-add-event"){ ui.addingEvent = false; render(); }
      else if(action === "confirm-add-event"){
        var inp4 = document.getElementById("event-name-input");
        addEvent(inp4 ? inp4.value : "");
      }
    };
    app.onkeydown = function(e){
      if(e.key === "Enter" && e.target && e.target.id === "guest-name-input"){
        e.preventDefault();
        addGuest(e.target.value);
      }
      if(e.key === "Enter" && e.target && e.target.id === "event-name-input"){
        e.preventDefault();
        addEvent(e.target.value);
      }
    };
    app.oninput = function(e){
      if(e.target && e.target.id === "email-input"){ ui.email = e.target.value; }
      if(e.target && e.target.id === "notes-input"){ ui.notes = e.target.value; }
    };
    app.querySelectorAll("[data-act-details]").forEach(function(de){
      de.addEventListener("toggle", function(){
        ui.openActivities[de.dataset.actDetails] = de.open;
      });
    });
  }

  document.getElementById("app").innerHTML =
    '<div class="hero"><h1>Fall Hangouts</h1><p>Loading the latest plans…</p></div>';

  var firstLoad = true;
  window.__firestore.onSnapshot(window.__firestore.stateDocRef, function(snap){
    state = normalizeState(snap.exists() ? snap.data() : JSON.parse(JSON.stringify(SEED_STATE)));
    if(firstLoad){
      firstLoad = false;
      restoreFromStorage();
    }
    render();
  }, function(err){
    console.error(err);
    document.getElementById("app").innerHTML =
      '<div class="hero"><h1>Fall Hangouts</h1><p>Couldn\'t connect right now — try refreshing the page.</p></div>';
  });
})();
</script>
</body>
</html>
